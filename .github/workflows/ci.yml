name: CI

# Runs on every pull request so branch protection has a real check to require.
# Without this, "require status checks" would have nothing to gate on and a PR
# could be merged without the generator ever being exercised.

on:
  pull_request:
  push:
    branches: [main]
  # Lets a verification run be asked for by hand. Needed when a commit reaches
  # main without one: an administrator merge bypasses the required check, and a
  # GitHub Actions outage can swallow the push event outright, leaving a commit
  # on main that no run will ever cover. Without this the only way to re-verify
  # is an empty commit.
  workflow_dispatch:

# Least privilege: this job only reads the repository. Nothing here needs to
# write contents, open pull requests, or touch packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs rather than tags. A tag can be moved
      # to point at new code; a SHA cannot, so a compromised upstream release
      # cannot silently execute here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The site rebuilds layouts in the browser so a swapped slot can change
      # which slots are filled. That is a second implementation of the layout
      # maths, and a silent divergence would hand players a wrong import string.
      # Uses the runner's preinstalled Node rather than adding another action to
      # pin and trust; the check needs no packages.
      - name: Check the browser layout port matches the generator
        run: node tests/check_layout_port.mjs

      - name: Check published data is well formed
        run: |
          python - <<'PY'
          import json, pathlib, sys

          sys.path.insert(0, "generator")
          from encode import UNSAFE_NAME, parse_hub_import_string, parse_official_import_string

          index = json.loads(pathlib.Path("index.json").read_text(encoding="utf-8"))
          files = list(pathlib.Path("data").glob("*.json"))
          if len(files) != index["activityCount"]:
              sys.exit(f"index lists {index['activityCount']} activities but data/ has {len(files)}")

          total = 0
          for path in files:
              record = json.loads(path.read_text(encoding="utf-8"))
              for variant in record["variants"]:
                  total += 1
                  where = f"{path.name}/{variant['variant']}"
                  # RuneLite strips these on import, so a name carrying one
                  # arrives in game as something other than what is published.
                  if UNSAFE_NAME.search(variant["tagName"]):
                      sys.exit(f"{where}: tag name {variant['tagName']!r} will not survive import")
                  for key in (
                      "importString", "importStringZigzag",
                      "importStringOfficial", "importStringZigzagOfficial",
                      "layout", "layoutZigzag",
                  ):
                      if key not in variant:
                          sys.exit(f"{where}: missing {key}")
                  # Parsed the way each client parses it, so a string that only
                  # looks right cannot pass. Both styles, both clients.
                  for key, layout_key in (
                      ("importString", "layout"),
                      ("importStringZigzag", "layoutZigzag"),
                  ):
                      parsed = parse_hub_import_string(variant[key])
                      want = {k: int(v) for k, v in variant[layout_key].items()}
                      if parsed["layout"] != want or parsed["tagName"] != variant["tagName"]:
                          sys.exit(f"{where}: {key} does not carry {layout_key}")
                      if set(want.values()) - set(parsed["tagItems"]):
                          sys.exit(f"{where}: {key} lays out items it does not tag")
                  for key, layout_key in (
                      ("importStringOfficial", "layout"),
                      ("importStringZigzagOfficial", "layoutZigzag"),
                  ):
                      want = {k: int(v) for k, v in variant[layout_key].items()}
                      if parse_official_import_string(variant[key]) != want:
                          sys.exit(f"{where}: {key} does not carry {layout_key}")
                  if sorted(variant["layout"].values()) != sorted(variant["layoutZigzag"].values()):
                      sys.exit(f"{path.name}/{variant['variant']}: layout styles disagree")
                  # A layout that departs from the wiki must say why, or the
                  # library is quietly asserting something the source does not.
                  if variant.get("curated") and not variant.get("curationReason"):
                      sys.exit(f"{path.name}/{variant['variant']}: curated with no reason")
          if total != index["layoutCount"]:
              sys.exit(f"index lists {index['layoutCount']} layouts but data/ has {total}")
          print(f"ok: {len(files)} activities, {total} layouts")
          PY
