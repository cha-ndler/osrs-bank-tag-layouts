<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Bank Tag Layouts</title>
<meta name="description" content="Bank tag layouts for Old School RuneScape bosses and raids, generated from the OSRS Wiki.">
<style>
  :root {
    --bg: #12110f; --panel: #1a1815; --raise: #22201c; --edge: #2e2b26; --ink: #ece6dc;
    --muted: #958c81; --accent: #d9b45a; --on-accent: #1a1610; --slot: #1f1d19;
    --ok: #74c27a; --sel: rgba(217, 180, 90, .14);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f3ec; --panel: #fffdf9; --raise: #f1ece1; --edge: #e2dacb; --ink: #211d18;
      --muted: #6e665c; --accent: #8a6a17; --on-accent: #fffdf8; --slot: #efe9dc;
      --ok: #2f7a34; --sel: rgba(138, 106, 23, .1);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---- shell: index on the left, one activity on the right ---- */
  .app {
    display: grid; grid-template-columns: 300px 1fr; height: 100vh; height: 100dvh;
  }
  .index {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--edge); background: var(--panel);
  }
  .brand { padding: 20px 20px 12px; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .1px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .search { padding: 0 12px 10px; position: relative; }
  #q {
    width: 100%; padding: 9px 12px 9px 34px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--edge); border-radius: 8px;
  }
  #q::placeholder { color: var(--muted); }
  #q:focus { outline: none; border-color: var(--accent); }
  .search svg {
    position: absolute; left: 24px; top: 11px; width: 15px; height: 15px;
    color: var(--muted); pointer-events: none;
  }
  .search kbd {
    position: absolute; right: 22px; top: 8px; font: 11px/1 ui-monospace, monospace;
    padding: 4px 6px; color: var(--muted); border: 1px solid var(--edge); border-radius: 4px;
  }
  .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
  #count { padding: 0 20px 8px; color: var(--muted); font-size: 11px; }
  #list { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; flex: 1; }
  #list a {
    display: flex; align-items: baseline; gap: 8px; padding: 7px 12px;
    border-radius: 6px; text-decoration: none;
  }
  #list a:hover { background: var(--raise); }
  #list a[aria-current="page"] { background: var(--sel); color: var(--accent); }
  #list .name { flex: 1; min-width: 0; }
  #list .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  #list .via {
    display: block; color: var(--muted); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .index footer { padding: 12px 20px 16px; border-top: 1px solid var(--edge); color: var(--muted); font-size: 11px; }
  .index footer p { margin: 0 0 4px; }

  /* ---- detail ---- */
  #detail { overflow-y: auto; min-height: 0; }
  .pane { max-width: 500px; margin: 0 auto; padding: 32px 24px 64px; }
  .back { display: none; }
  .crumbs {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 18px;
  }
  .crumbs h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.2px; }
  .crumbs a { color: var(--muted); font-size: 12px; text-decoration: none; white-space: nowrap; }
  .crumbs a:hover { color: var(--accent); }

  .tabs {
    display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px;
    border-bottom: 1px solid var(--edge);
  }
  .tabs a {
    padding: 6px 10px 8px; margin-bottom: -1px; font-size: 13px; color: var(--muted);
    text-decoration: none; border-bottom: 2px solid transparent;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tagname { color: var(--muted); font-size: 12px; word-break: break-word; margin-right: auto; }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--edge); color: var(--muted);
  }
  .badge[title] { cursor: help; }
  .badge.curated { border-color: var(--accent); color: var(--accent); }

  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
    padding: 8px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
  }
  .cell {
    aspect-ratio: 1; background: var(--slot); border-radius: 4px; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center; min-width: 0;
  }
  .cell img { width: 78%; height: 78%; object-fit: contain; image-rendering: pixelated; }
  /* Slots the wiki ranked can be stepped through. Marked at rest so the choice
     is discoverable without hunting for it. */
  button.cell { cursor: pointer; box-shadow: inset 0 0 0 1px var(--accent); }
  button.cell:hover { background: var(--sel); }
  button.cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: var(--sel); }
  /* Names the clue supply group on the rows below it. Spans the grid, so the
     eight bank columns are untouched. */
  .group-label {
    grid-column: 1 / -1; padding: 6px 2px 1px; font-size: 11px; line-height: 1.3;
    color: var(--muted); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-label:hover { color: var(--accent); text-decoration: underline; }

  .swap {
    display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 32px;
    color: var(--muted); font-size: 12px;
  }
  .swap .slot { color: var(--ink); text-transform: capitalize; margin-right: auto; }
  button.step, button.reset, .seg button {
    padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--muted);
    background: transparent; border: 1px solid var(--edge); border-radius: 6px;
  }
  button.step:hover:not(:disabled), button.reset:hover { color: var(--ink); border-color: var(--muted); }
  button.step:disabled { opacity: .35; cursor: default; }

  .actions {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 10px 16px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--edge);
  }
  .seg { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .seg > span { display: inline-flex; padding: 2px; background: var(--raise); border-radius: 7px; }
  .seg button { border: 0; padding: 4px 10px; border-radius: 5px; }
  .seg button[aria-pressed="true"] { color: var(--ink); background: var(--panel); box-shadow: 0 0 0 1px var(--edge); }
  .copyrow { display: flex; gap: 8px; margin-top: 14px; }
  button.copy {
    flex: 1; padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px;
    transition: background .15s;
  }
  button.copy:hover { filter: brightness(1.06); }
  button.copy.done { background: var(--ok); }
  .copyrow button.reset { padding: 0 14px; font-size: 13px; border-radius: 8px; }

  details { margin-top: 14px; font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; width: fit-content; }
  details summary:hover { color: var(--ink); }
  details p, details ul { margin: 8px 0 0; }
  details ul { padding-left: 18px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }

  .welcome { max-width: 420px; margin: 18vh auto 0; padding: 0 28px; color: var(--muted); }
  .welcome h2 { color: var(--ink); font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  .welcome ol { padding-left: 18px; margin: 16px 0 0; }
  .welcome li { margin-bottom: 6px; }
  .welcome a { color: var(--accent); }
  .empty { color: var(--muted); padding: 24px 12px; font-size: 13px; }

  /* ---- narrow screens: the index is home, an activity replaces it ---- */
  @media (max-width: 820px) {
    .app { display: block; height: auto; }
    .index { border-right: 0; min-height: 100vh; min-height: 100dvh; }
    .index footer { border-top: 0; }
    #list { overflow: visible; }
    .search { position: sticky; top: 0; z-index: 2; background: var(--panel); padding-top: 8px; }
    .search svg { top: 19px; }
    .search kbd { display: none; }
    #detail { display: none; }
    body.reading .index { display: none; }
    body.reading #detail { display: block; }
    .welcome { display: none; }
    .pane { padding: 16px 16px 48px; }
    .back {
      display: inline-flex; gap: 4px; margin-bottom: 14px; color: var(--muted);
      font-size: 13px; text-decoration: none;
    }
    .crumbs h2 { font-size: 19px; }
    .grid { padding: 6px; gap: 2px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="index" aria-label="Activities">
    <div class="brand">
      <h1>Bank Tag Layouts</h1>
      <p>Old School RuneScape, from the OSRS Wiki</p>
    </div>
    <div class="search">
      <label class="visually-hidden" for="q">Search layouts by activity or variant</label>
      <input id="q" type="search" placeholder="Search bosses, raids, variants" autocomplete="off" spellcheck="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div id="count" role="status" aria-live="polite"></div>
    <ul id="list"></ul>
    <footer>
      <p id="meta"></p>
      <p>
        Data from the <a href="https://oldschool.runescape.wiki/" rel="noopener">OSRS Wiki</a>,
        <a href="https://creativecommons.org/licenses/by-nc-sa/3.0/" rel="noopener">CC BY-NC-SA 3.0</a>.
        Not affiliated with Jagex.
      </p>
    </footer>
  </nav>
  <main id="detail"></main>
</div>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
